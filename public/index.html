<body class="app-shell">
  <div class="app">
    <aside class="rail">
      <div class="brand">
        <div class="brand-mark">
          <img src="/brand/imani-leaf.png" alt="Imani Business Enterprise">
          <div class="brand-word">Imani Business<br>Enterprise<small>we make it possible</small></div>
        </div>
        <div class="brand-sub">Business Suite</div>
      </div>
      <nav class="rail-nav" id="railNav">
        <button data-view="dashboard" class="active"><span class="ic">◆</span><span class="nav-label">Dashboard</span></button>
        <button data-view="customers"><span class="ic">☺</span><span class="nav-label">Customers</span></button>
        <button data-view="pipeline"><span class="ic">▤</span><span class="nav-label">Pipeline</span></button>
        <button data-view="quotes"><span class="ic">▧</span><span class="nav-label">Quotes</span></button>
        <button data-view="services"><span class="ic">✺</span><span class="nav-label">Services</span></button>
        <button data-view="contracts"><span class="ic">▥</span><span class="nav-label">Contracts</span></button>
        <button data-view="library"><span class="ic">🗂</span><span class="nav-label">Document Library</span></button>
      </nav>
      <div class="rail-foot">
        <div class="rail-user"><span id="whoami" class="nav-label"></span><button id="logoutBtn" class="nav-label">Sign out</button></div>
        <div class="save-state" id="saveState">·</div>
        <button class="theme-toggle" id="themeToggle">Light / Dark</button>
      </div>
    </aside>

    <main class="view" id="mainView"></main>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-head">
      <input class="title-input" id="tTitle" placeholder="Name" />
      <button class="btn ghost" id="sheetClose">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot">
      <button class="btn danger" id="tDelete">Delete</button>
      <span class="save-state" id="sheetSaveState">Saved</span>
    </div>
  </div>

  <div class="modal-scrim" id="modalScrim">
    <div class="modal" id="modalBody"></div>
  </div>

  <div class="toast" id="toast"></div>
